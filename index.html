<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPADE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* HIDE SCROLLBAR */
body::-webkit-scrollbar { display: none; }
body { -ms-overflow-style: none; scrollbar-width: none; }

body {
    background: #000;
    color: white;
    overflow-x: hidden;
}

/* PARTICLES */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* LOCK SCREEN */
.lock {
    position: fixed;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(30px);
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: 1s;
}

/* ENTER BUTTON */
.enter-btn {
    padding: 15px 35px;
    border-radius: 12px;
    border: 1px solid #444;
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

.enter-btn:hover {
    background: white;
    color: black;
    transform: translateY(-3px);
}

/* MAIN BLUR */
.main {
    filter: blur(20px);
    transition: 1.2s;
}

/* SECTIONS */
.section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* HERO */
h1 {
    font-size: 80px;
    letter-spacing: 6px;
    background: linear-gradient(90deg,#fff,#777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #aaa;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 15px;
    margin: 20px;
    max-width: 500px;
}

/* LINKS */
.links a {
    display: inline-block;
    margin: 10px;
    padding: 12px 25px;
    border-radius: 10px;
    border: 1px solid #333;
    color: white;
    text-decoration: none;
    transition: .3s;
}
.links a:hover {
    background: white;
    color: black;
}

/* FADE */
.fade {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}
.fade.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body oncontextmenu="return false">

<canvas id="bg"></canvas>

<!-- LOCK -->
<div class="lock" id="lock">
    <button class="enter-btn" onclick="startVerify()">Enter Website</button>

    <div class="g-recaptcha"
        data-sitekey="6LcfqBMtAAAAAGrFbResTP1t0sSK_Ct-bnR5BjIz"
        data-callback="verified"
        data-size="invisible">
    </div>
</div>

<!-- AUDIO -->
<audio id="music" loop>
<source src="music/bg.mp3" type="audio/mpeg">
</audio>

<!-- MAIN -->
<div class="main" id="main">

<div class="section fade">
    <h1>SPADE</h1>
    <p class="subtitle">Founder • Developer • Designer</p>
</div>

<div class="section fade">
    <div class="card">
        <h2>About Me</h2>
        <p>I build Minecraft plugins and modern web UI with smooth systems and clean design.</p>
    </div>
</div>

<div class="section fade">
    <div class="card">
        <h2>Projects</h2>
        <p>Custom plugins, dashboards, server systems & more.</p>
    </div>
</div>

<div class="section fade">
    <div class="links">
        <a href="https://discord.gg/WmFFsAhbJ5">Discord</a>
        <a href="https://github.com/Kashzpade">GitHub</a>
    </div>
</div>

<div class="section fade">
    <div style="font-size:12px; opacity:0.5;">
        Protected by reCAPTCHA • Privacy & Terms apply
    </div>
</div>

</div>

<script>
// START CAPTCHA
function startVerify() {
    grecaptcha.execute();
}

// VERIFIED
function verified() {
    const lock = document.getElementById("lock");
    const main = document.getElementById("main");
    const music = document.getElementById("music");

    lock.style.opacity = "0";
    setTimeout(() => lock.style.display = "none", 1000);

    main.style.filter = "blur(0)";

    music.play();
}

// FADE SCROLL
const fades = document.querySelectorAll('.fade');
window.addEventListener('scroll', () => {
    fades.forEach(el => {
        const top = el.getBoundingClientRect().top;
        if(top < window.innerHeight - 100) {
            el.classList.add('show');
        }
    });
});

// PARTICLES
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<100;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        p.y += 0.4;
        if(p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
