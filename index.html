<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPADE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: radial-gradient(circle at top, #0f0f0f, #000);
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND GLOW */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent);
    top: -100px;
    left: -100px;
    z-index: -1;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    animation: fadeIn 1.2s ease;
}

h1 {
    font-size: 60px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #fff, #888);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 10px;
    color: #aaa;
}

/* BUTTONS */
.links {
    margin-top: 25px;
}

.links a {
    display: inline-block;
    margin: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid #333;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.links a:hover {
    background: white;
    color: black;
    transform: translateY(-3px);
}

/* CAPTCHA */
.captcha {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid #333;
    cursor: pointer;
    transition: 0.3s;
}

.captcha:hover {
    background: rgba(255,255,255,0.1);
}

.captcha.done {
    background: #1f8f3a;
    border-color: #1f8f3a;
}

/* ABOUT */
.about {
    padding: 80px 20px;
    text-align: center;
    max-width: 700px;
    margin: auto;
}

.about p {
    color: #aaa;
    line-height: 1.6;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px;
    font-size: 12px;
    color: #555;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bgmusic" loop>
    <source src="music/bg.mp3" type="audio/mpeg">
</audio>

<!-- HERO -->
<div class="hero">
    <div class="card">
        <h1>SPADE</h1>
        <p class="subtitle">Founder of SP-Team • Plugin Developer • Web Designer</p>

        <div class="captcha" onclick="verify()">
            ✔ Click to verify you're human
        </div>

        <div class="links" id="links" style="display:none;">
            <a href="https://discord.gg/WmFFsAhbJ5">Discord</a>
            <a href="https://github.com/Kashzpade">GitHub</a>
        </div>
    </div>
</div>

<!-- ABOUT -->
<div class="about">
    <p>
        I'm SPADE, focused on building Minecraft plugins and clean modern web UI.
        I like creating smooth systems and making things look simple but powerful.
    </p>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 SPADE — All rights reserved
</div>

<script>
function verify() {
    const captcha = document.querySelector(".captcha");
    const links = document.getElementById("links");
    const music = document.getElementById("bgmusic");

    captcha.classList.add("done");
    captcha.innerText = "✔ Verified";

    links.style.display = "block";

    music.play(); // start music on click
}
</script>

</body>
</html>
