<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPADE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
    color: white;
}

/* BACKGROUND */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* CENTER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* RGB TEXT */
.rgb {
    font-size: 75px;
    font-weight: bold;
    animation: rgb 4s linear infinite;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

@keyframes rgb {
    0% {color: red;}
    25% {color: cyan;}
    50% {color: lime;}
    75% {color: magenta;}
    100% {color: red;}
}

.subtitle {
    margin-top: 10px;
    color: #aaa;
}

/* BUTTON */
.btn {
    margin-top: 30px;
    padding: 12px 30px;
    border: 1px solid #444;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    background: white;
    color: black;
    transform: translateY(-3px);
}

/* NOTIF */
.notif {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.85);
    border: 1px solid #333;
    padding: 15px 20px;
    border-radius: 10px;
    display: none;
    animation: slide 0.4s ease;
}

@keyframes slide {
    from {transform: translateY(40px); opacity: 0;}
    to {transform: translateY(0); opacity: 1;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<audio id="music" loop>
<source src="music/bg.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="rgb">SPADE</div>
    <div class="subtitle">Developer • Creator • Builder</div>

    <div class="btn" onclick="start()">ENTER</div>
</div>

<div class="notif" id="notif">
    🔔 Subscribe ke youtube.com/@Kashspade
</div>

<script>
// START BUTTON
function start() {
    document.getElementById("music").play();
    showNotif();
}

// SHOW NOTIF
function showNotif() {
    const notif = document.getElementById("notif");
    notif.style.display = "block";

    setTimeout(() => {
        notif.style.display = "none";
    }, 3000);
}

// KLIK KANAN = NOTIF + BLOCK MENU
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
    showNotif();
});

// PARTICLES
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<120;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.y += 0.4;
        if(p.y > canvas.height) p.y = 0;
    });

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
