<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPADE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* BACKGROUND */
body {
    background: #000;
    color: white;
    overflow-x: hidden;
}

/* ANIMATED BACKGROUND */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 20%, #111, transparent),
                radial-gradient(circle at 80% 80%, #111, transparent);
    animation: moveBg 10s infinite alternate;
    z-index: -2;
}

@keyframes moveBg {
    0% {transform: translate(0,0);}
    100% {transform: translate(-50px,-50px);}
}

/* BLUR LOCK */
.lock {
    position: fixed;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(20px);
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: 0.8s;
}

/* CAPTCHA CARD */
.verify-box {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
    animation: fadeIn 1s ease;
}

.verify-box h2 {
    margin-bottom: 15px;
}

/* MAIN CONTENT */
.main {
    filter: blur(10px);
    transition: 1s;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 50px;
    border-radius: 20px;
    text-align: center;
}

h1 {
    font-size: 70px;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #fff, #aaa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 10px;
    color: #aaa;
}

/* BUTTONS */
.links {
    margin-top: 30px;
}

.links a {
    display: inline-block;
    margin: 10px;
    padding: 14px 28px;
    border-radius: 12px;
    border: 1px solid #333;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.links a:hover {
    background: white;
    color: black;
    transform: translateY(-4px);
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- LOCK SCREEN -->
<div class="lock" id="lock">
    <div class="verify-box">
        <h2>Verify You're Human</h2>
        <div class="g-recaptcha" data-sitekey="6LegpxMtAAAAAL2sriLiwArLfDNqfJQTX5aJqVIh" data-callback="verified"></div>
    </div>
</div>

<!-- AUDIO -->
<audio id="music" loop>
    <source src="music/bg.mp3" type="audio/mpeg">
</audio>

<!-- MAIN -->
<div class="main" id="main">
    <div class="hero">
        <div class="card">
            <h1>SPADE</h1>
            <p class="subtitle">Founder of SP-Team • Plugin Developer • Web Designer</p>

            <div class="links">
                <a href="https://discord.gg/WmFFsAhbJ5">Discord</a>
                <a href="https://github.com/Kashzpade">GitHub</a>
            </div>
        </div>
    </div>
</div>

<script>
function verified() {
    const lock = document.getElementById("lock");
    const main = document.getElementById("main");
    const music = document.getElementById("music");

    lock.style.opacity = "0";
    setTimeout(() => lock.style.display = "none", 800);

    main.style.filter = "blur(0)";

    music.play(); // start music setelah captcha
}
</script>

</body>
</html>
