<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPADE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;}

body {
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
    color: white;
}

/* BG */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* CENTER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* RGB */
.rgb {
    font-size: 80px;
    animation: rgb 4s linear infinite;
}
@keyframes rgb {
    0%{color:red;}25%{color:cyan;}50%{color:lime;}75%{color:magenta;}100%{color:red;}
}

.subtitle {color:#aaa; margin-top:10px;}

.btn {
    margin-top:30px;
    padding:12px 35px;
    border:1px solid #444;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    cursor:pointer;
    transition:.3s;
}
.btn:hover {
    background:white;
    color:black;
}

/* ABOUT PANEL */
.about {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 500px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    opacity: 0;
    transition: 0.6s;
}

.about.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.about h2 {
    margin-bottom: 10px;
}

.about p {
    color: #aaa;
    line-height: 1.5;
}

/* NOTIF */
.notif {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: rgba(0,0,0,0.9);
    border: 1px solid #333;
    padding: 15px 20px;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<audio id="music" loop>
<source src="music/bg.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <div class="rgb">SPADE</div>
    <div class="subtitle">Developer • Creator • Builder</div>
    <div class="btn" onclick="enter()">ENTER</div>
</div>

<div class="about" id="about">
    <h2>SPADE</h2>
    <p id="text"></p>
</div>

<div class="notif" id="notif">
🔔 Subscribe ke youtube.com/@Kashspade
</div>

<script>
// TEXT TYPING
const content = `
Youtube: Kashspade
© SP-Team Founder
Plugin Developer • Web Designer

! Building Minecraft plugins & clean web UI
! Focus on performance & aesthetics
⌕ Discord: discord.gg/WmFFsAhbJ5
⌕ GitHub: Kashzpade
`;

function typeText(el, text, i=0) {
    if(i < text.length){
        el.innerHTML += text.charAt(i);
        setTimeout(() => typeText(el, text, i+1), 20);
    }
}

// ENTER
function enter() {
    document.getElementById("music").play();

    const about = document.getElementById("about");
    about.classList.add("show");

    typeText(document.getElementById("text"), content);
}

// RIGHT CLICK
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
    const notif = document.getElementById("notif");
    notif.style.display = "block";

    setTimeout(()=>notif.style.display="none",3000);
});

// PARTICLES
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<120;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        p.y+=0.4;
        if(p.y>canvas.height)p.y=0;
    });
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
